[project]
name = "ai-based-fruit-quality-detection"
version = "0.1.0"
description = "AI-Based Fruit Quality & Ripeness Detection Web App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.7.0"
]

[tool.vercel]
entrypoint = "api/index.py"
